# Fuentes del radar. type: rss | remoteok | reddit | hn | sheet
# Upwork discontinuó RSS para búsquedas de trabajo el 20/08/2024 (confirmado en su
# Help Center: "RSS deprecation"). /ab/feed/jobs/rss devuelve 404 sin importar qué
# búsqueda guardes. No hay URL que pegar acá — el único camino ToS-compliant que
# queda es su Developer API oficial (OAuth, requiere registrar app y aprobación).
# Ver CLAUDE.md pendiente #1.
sources:
  # ---------- Upwork: sin fuente automatizada por ahora, ver nota arriba ----------

  # ---------- Feeds abiertos (funcionan sin cuenta) ----------
  - name: remoteok
    type: remoteok
    enabled: true
    url: "https://remoteok.com/api"
  - name: weworkremotely-prog
    type: rss
    enabled: true
    url: "https://weworkremotely.com/categories/remote-programming-jobs.rss"
  - name: weworkremotely-contract
    type: rss
    enabled: true
    url: "https://weworkremotely.com/categories/remote-contract-jobs.rss"

  # ---------- Reddit (JSON público, sin credenciales) ----------
  - name: reddit-forhire
    type: reddit
    enabled: true
    url: "https://www.reddit.com/r/forhire/new.json?limit=100"
  - name: reddit-slavelabour
    type: reddit
    enabled: true
    url: "https://www.reddit.com/r/slavelabour/new.json?limit=100"
  - name: reddit-jobbit
    type: reddit
    enabled: true
    url: "https://www.reddit.com/r/jobbit/new.json?limit=100"
  - name: reddit-n8n
    type: reddit
    enabled: true
    url: "https://www.reddit.com/r/n8n/new.json?limit=50"
  - name: reddit-datascience-jobs
    type: reddit
    enabled: false
    url: "https://www.reddit.com/r/DataScienceJobs/new.json?limit=50"

  # ---------- Hacker News: hilo mensual de freelance ----------
  - name: hn-seeking-freelancer
    type: hn
    enabled: true
    url: ""

  # ---------- Google Sheets: carga manual de leads ----------
  # Google Sheets > Archivo > Compartir > Publicar en la web > seleccionar la hoja >
  # formato CSV > Publicar. Pegá acá el link que te da (termina en /pub?output=csv).
  # Columnas esperadas (cualquier orden, ES o EN): title/titulo, url/link (obligatoria),
  # description/descripcion, budget/presupuesto (opcional).
  - name: sheet-leads
    type: sheet
    enabled: false
    url: "PEGA_ACA_EL_LINK_CSV_DE_TU_GOOGLE_SHEET"

  # ---------- Remotive: API pública (uso personal, no republicar a terceros) ----------
  - name: remotive
    type: remotive
    enabled: true
    url: "https://remotive.com/api/remote-jobs"

  # ---------- Himalayas: API pública, gratis, con búsqueda (atribución en el pie del CRM) ----------
  # Empty locationRestrictions = mundial; el scoring resta 30 si no incluye Argentina/LATAM.
  - name: himalayas-contract
    type: himalayas
    enabled: true
    params: {worldwide: "true", employment_type: contractor}
    queries: [n8n, automation, dbt, bigquery, "data engineer", "analytics engineer", "web scraping", python, react, node, chatbot, "ai agent"]
  - name: himalayas-argentina
    type: himalayas
    enabled: true
    params: {country: AR}
    queries: [data, python, automation, react, analytics, developer]
  - name: himalayas-junior
    type: himalayas
    enabled: true
    params: {worldwide: "true"}
    queries: ["junior data analyst", "junior python", "junior developer", "analytics engineer", n8n]

  # ---------- Jobicy: API pública (crédito con link a Jobicy; el botón de postular va al aviso original) ----------
  - name: jobicy
    type: jobicy
    enabled: true
    queries:
      - {geo: latam}
      - {geo: anywhere, tag: automation}
      - {geo: anywhere, tag: data}
