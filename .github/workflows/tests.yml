name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Sin internet ni claves: app web, capa Turso (mockeada), store y scoring.
      - run: python scripts/selftest_web.py
